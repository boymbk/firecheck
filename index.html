<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบตรวจสอบถังดับเพลิงประจำเดือน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F6F2EA;
    --surface:#FFFFFF;
    --ink:#241F1C;
    --ink-soft:#6B615A;
    --line:#E4DCD0;
    --red:#C1272D;
    --red-deep:#8F1C21;
    --amber:#E8890C;
    --green:#2F9E44;
    --steel:#3A3531;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',sans-serif;}
  .num{font-family:'Oswald',sans-serif;}

  header{background:var(--steel);color:#fff;padding:20px 24px;position:relative;overflow:hidden;}
  header::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:14px solid rgba(193,39,45,.35);}
  .header-inner{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:14px;position:relative;z-index:1;}
  .brand-mark{width:46px;height:46px;border-radius:9px;background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
  header h1{margin:0;font-size:18px;font-weight:700;}
  header p{margin:3px 0 0;font-size:12.5px;color:#cfc9c4;}
  .fire-stripe{height:7px;background:repeating-linear-gradient(135deg,var(--red) 0 12px,var(--steel) 12px 24px);}

  main{max-width:760px;margin:0 auto;padding:26px 20px 60px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;}

  h2.section-title{font-size:16px;font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:8px;}
  h2.section-title::before{content:"";width:5px;height:16px;background:var(--red);display:inline-block;border-radius:2px;}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
  .field input,.field textarea{font-family:'Sarabun',sans-serif;font-size:15px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);}
  .field input:focus{outline:2px solid var(--red);outline-offset:-1px;}

  button.primary{background:var(--red);color:#fff;border:none;padding:13px 20px;border-radius:8px;font-family:'Sarabun',sans-serif;font-weight:700;font-size:15px;cursor:pointer;width:100%;}
  button.primary:hover{background:var(--red-deep);}
  button.ghost{background:none;border:1px solid var(--line);padding:9px 15px;border-radius:8px;font-family:'Sarabun',sans-serif;font-size:13.5px;cursor:pointer;color:var(--ink-soft);}
  button.ghost:hover{border-color:var(--ink);color:var(--ink);}
  button:disabled{opacity:.5;cursor:not-allowed;}

  .checklist-item{display:flex;align-items:flex-start;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
  .checklist-item:last-child{border-bottom:none;}
  .checklist-item input[type=checkbox]{width:22px;height:22px;margin-top:1px;accent-color:var(--red);flex-shrink:0;cursor:pointer;}
  .checklist-item .ci-num{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink-soft);width:20px;flex-shrink:0;}
  .checklist-item .ci-text{font-size:14.5px;line-height:1.4;}

  .status-badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;}
  .status-badge.ok{background:#e6f6ea;color:var(--green);}
  .status-badge.due{background:#fff3e0;color:var(--amber);}
  .status-badge.never{background:#fdecec;color:var(--red);}

  .pin-wrap{max-width:340px;margin:60px auto;text-align:center;}
  .pin-wrap h2{font-size:18px;margin-bottom:4px;}
  .pin-wrap p{color:var(--ink-soft);font-size:13.5px;margin-top:0;margin-bottom:20px;}
  .pin-input{font-family:'Oswald',sans-serif;font-size:26px;letter-spacing:8px;text-align:center;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;}
  .pin-input:focus{outline:2px solid var(--red);border-color:var(--red);}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:9px 10px;background:#FAF7F2;color:var(--ink-soft);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr.tank-row{cursor:pointer;}
  tr.tank-row:hover td{background:#FAF7F2;}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:8px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,20,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:12px;padding:24px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .success-wrap{text-align:center;padding:40px 10px;}
  .success-wrap .check{font-size:52px;margin-bottom:10px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .loading{padding:60px;text-align:center;color:var(--ink-soft);font-size:14px;}
  .empty-state{text-align:center;padding:40px 20px;color:var(--ink-soft);}

  @media print{
    header,.fire-stripe,.no-print{display:none !important;}
    body{background:#fff;}
  }
  .qr-print-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .qr-print-cell{text-align:center;border:1px dashed #999;padding:10px;border-radius:8px;page-break-inside:avoid;}
  .qr-print-cell img{width:100%;max-width:130px;}
  .qr-print-cell .lbl{font-family:'Oswald',sans-serif;font-weight:700;font-size:13px;margin-top:4px;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-mark">🧯</div>
    <div>
      <h1>ระบบตรวจสอบถังดับเพลิงประจำเดือน</h1>
      <p>สแกน QR ที่ถัง เพื่อบันทึกผลการตรวจ</p>
    </div>
  </div>
</header>
<div class="fire-stripe"></div>

<main id="mainContent"><div class="loading">กำลังโหลด...</div></main>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- FIREBASE CONFIG (โปรเจกต์เดียวกับ stockweb) ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyB-f127T1LX5800MoavLGPUW6lw9qAHq-0",
  authDomain: "stockweb-bcd85.firebaseapp.com",
  projectId: "stockweb-bcd85",
  storageBucket: "stockweb-bcd85.firebasestorage.app",
  messagingSenderId: "586543641375",
  appId: "1:586543641375:web:6d41d4e2b5a0244db6762a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const ACCESS_PIN = '25362536';
const TOTAL_TANKS = 60;
const CHECKLIST_ITEMS = [
  { key:'gauge', text:'ดูที่เข็มในมาตรวัด (Pressure Gauge)' },
  { key:'hose', text:'ตรวจสายฉีด หัวฉีด' },
  { key:'body', text:'ตรวจสภาพบรรจุของถังดับเพลิง' },
  { key:'lever', text:'ตรวจสอบคันบีบ' },
  { key:'seal', text:'สลักถังดับเพลิงและซีลล็อก' }
];

const params = new URLSearchParams(location.search);
const tankNumber = params.get('tank') ? parseInt(params.get('tank')) : null;
let tanks = [];
let inspections = [];
let pinOk = false;
let tanksReady = false;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalBody').innerHTML = '';
}
function openModal(html){
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
document.getElementById('modalOverlay').addEventListener('click', e=>{ if(e.target.id==='modalOverlay') closeModal(); });
function fmtDate(d){
  return new Date(d).toLocaleString('th-TH', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function daysSince(d){ return Math.floor((Date.now() - new Date(d).getTime()) / 86400000); }

/* ---------------- FIRESTORE LISTENERS ---------------- */
function initListeners(){
  db.collection('fire_tanks').onSnapshot(snap=>{
    tanks = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(!tanksReady){
      tanksReady = true;
      if(tanks.length === 0){ seedTanks(); }
    }
    render();
  }, err=>{
    console.error(err);
    document.getElementById('mainContent').innerHTML = '<div class="loading" style="color:var(--red);">⚠️ เชื่อมต่อฐานข้อมูลไม่สำเร็จ ตรวจสอบการตั้งค่า Firestore</div>';
  });
  db.collection('fire_inspections').onSnapshot(snap=>{
    inspections = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>console.error(err));
}
async function seedTanks(){
  const batch = db.batch();
  for(let n=1; n<=TOTAL_TANKS; n++){
    batch.set(db.collection('fire_tanks').doc(String(n)), { number:n, name:`ถังดับเพลิงหมายเลข ${n}`, location:'' });
  }
  await batch.commit();
}
function lastInspectionOf(tankNum){
  const list = inspections.filter(i=>i.tank_number===tankNum).sort((a,b)=>new Date(b.date)-new Date(a.date));
  return list[0] || null;
}
function tankStatus(tankNum){
  const last = lastInspectionOf(tankNum);
  if(!last) return 'never';
  return daysSince(last.date) > 35 ? 'due' : 'ok';
}

/* ---------------- PIN GATE ---------------- */
function renderPinGate(onSuccess){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="pin-wrap">
      <h2>🔒 ตรวจถังดับเพลิง</h2>
      <p>กรุณากรอกรหัสผ่านเพื่อเข้าทำการตรวจ</p>
      <input type="password" inputmode="numeric" class="pin-input" id="pinInput" placeholder="••••••••" maxlength="12" autofocus>
      <button class="primary" id="pinSubmit" style="margin-top:16px;">เข้าสู่ระบบ</button>
    </div>`;
  const submit = ()=>{
    const val = document.getElementById('pinInput').value;
    if(val === ACCESS_PIN){ pinOk = true; onSuccess(); }
    else{ showToast('รหัสผ่านไม่ถูกต้อง'); }
  };
  document.getElementById('pinSubmit').addEventListener('click', submit);
  document.getElementById('pinInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
}

/* ---------------- TANK INSPECTION VIEW (scanned from QR) ---------------- */
function renderTankInspection(){
  const tank = tanks.find(t=>t.number===tankNumber);
  if(!tank){
    document.getElementById('mainContent').innerHTML = `<div class="card"><div class="empty-state">ไม่พบถังหมายเลข ${tankNumber} ในระบบ</div></div>`;
    return;
  }
  const last = lastInspectionOf(tankNumber);
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card" style="margin-bottom:16px;">
      <h2 class="section-title">${tank.name}</h2>
      ${tank.location ? `<div style="font-size:13.5px;color:var(--ink-soft);margin-bottom:6px;">📍 ${tank.location}</div>` : ''}
      <div style="font-size:13px;color:var(--ink-soft);">
        ${last ? `ตรวจครั้งล่าสุด: ${fmtDate(last.date)} โดย ${last.inspector} (${daysSince(last.date)} วันที่แล้ว)` : 'ยังไม่เคยมีการตรวจถังนี้มาก่อน'}
      </div>
    </div>
    <div class="card">
      <h2 class="section-title">รายการตรวจวันนี้ — ${fmtDate(new Date())}</h2>
      <div class="field"><label>ชื่อผู้ตรวจ</label><input id="inspector_name" placeholder="ชื่อ-สกุล"></div>
      <div style="margin:14px 0;">
        ${CHECKLIST_ITEMS.map((c,idx)=>`
          <label class="checklist-item">
            <input type="checkbox" data-check="${c.key}">
            <span class="ci-num">${idx+1}.</span>
            <span class="ci-text">${c.text}</span>
          </label>`).join('')}
      </div>
      <div class="field"><label>หมายเหตุ (ถ้าพบสิ่งผิดปกติ)</label><textarea id="inspect_note" rows="2" placeholder="ระบุปัญหาที่พบ (ถ้ามี)"></textarea></div>
      <button class="primary" id="submitInspection">✅ บันทึกผลการตรวจ</button>
    </div>`;

  document.getElementById('submitInspection').addEventListener('click', async ()=>{
    const inspector = document.getElementById('inspector_name').value.trim();
    if(!inspector){ showToast('กรุณาระบุชื่อผู้ตรวจ'); return; }
    const checklist = {};
    let allChecked = true;
    CHECKLIST_ITEMS.forEach(c=>{
      const checked = document.querySelector(`[data-check="${c.key}"]`).checked;
      checklist[c.key] = checked;
      if(!checked) allChecked = false;
    });
    if(!allChecked){ showToast('กรุณาติ๊กตรวจครบทั้ง 5 รายการ'); return; }
    const note = document.getElementById('inspect_note').value.trim();
    try{
      await db.collection('fire_inspections').add({
        tank_number: tankNumber, date: new Date().toISOString(), inspector, checklist, note
      });
      renderInspectionSuccess(tank);
    }catch(e){ showToast('บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง'); }
  });
}
function renderInspectionSuccess(tank){
  document.getElementById('mainContent').innerHTML = `
    <div class="card success-wrap">
      <div class="check">✅</div>
      <h2 style="margin:0 0 6px;">บันทึกผลการตรวจแล้ว</h2>
      <p style="color:var(--ink-soft);">${tank.name}<br>${fmtDate(new Date())}</p>
    </div>`;
}

/* ---------------- ADMIN DASHBOARD (no ?tank= param) ---------------- */
function renderAdminDashboard(){
  const main = document.getElementById('mainContent');
  const okCount = tanks.filter(t=>tankStatus(t.number)==='ok').length;
  const dueCount = tanks.filter(t=>tankStatus(t.number)==='due').length;
  const neverCount = tanks.filter(t=>tankStatus(t.number)==='never').length;
  main.innerHTML = `
    <div class="toolbar">
      <div style="font-size:13.5px;color:var(--ink-soft);">
        <span class="status-badge ok">${okCount} ปกติ</span> &nbsp;
        <span class="status-badge due">${dueCount} เกินกำหนด</span> &nbsp;
        <span class="status-badge never">${neverCount} ยังไม่เคยตรวจ</span>
      </div>
      <button class="ghost" id="printAllQrBtn">🖨 พิมพ์ QR ทั้งหมด 60 ถัง</button>
    </div>
    <div class="card" style="padding:0;overflow-x:auto;">
      <table>
        <thead><tr><th>ถังที่</th><th>ชื่อ / ตำแหน่ง</th><th>ตรวจล่าสุด</th><th>สถานะ</th><th></th></tr></thead>
        <tbody>
        ${tanks.sort((a,b)=>a.number-b.number).map(t=>{
          const last = lastInspectionOf(t.number);
          const st = tankStatus(t.number);
          const stLabel = st==='ok' ? 'ปกติ' : st==='due' ? 'เกินกำหนด' : 'ยังไม่เคยตรวจ';
          return `<tr class="tank-row" data-tank="${t.number}">
            <td class="num">${t.number}</td>
            <td>${t.name}${t.location?` <span style="color:var(--ink-soft);">· ${t.location}</span>`:''}</td>
            <td>${last ? fmtDate(last.date) : '-'}</td>
            <td><span class="status-badge ${st}">${stLabel}</span></td>
            <td><button class="ghost" data-edit-tank="${t.number}" style="padding:5px 10px;font-size:12px;">แก้ไข</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>`;

  document.querySelectorAll('[data-tank]').forEach(row=>{
    row.addEventListener('click', e=>{
      if(e.target.closest('[data-edit-tank]')) return;
      openTankHistoryModal(parseInt(row.dataset.tank));
    });
  });
  document.querySelectorAll('[data-edit-tank]').forEach(btn=>{
    btn.addEventListener('click', e=>{ e.stopPropagation(); openEditTankModal(parseInt(btn.dataset.editTank)); });
  });
  document.getElementById('printAllQrBtn').addEventListener('click', printAllQr);
}

function openEditTankModal(num){
  const tank = tanks.find(t=>t.number===num);
  openModal(`
    <h3>แก้ไขถังดับเพลิงหมายเลข ${num}</h3>
    <div class="field"><label>ชื่อ / คำอธิบาย</label><input id="et_name" value="${tank.name}"></div>
    <div class="field"><label>ตำแหน่งที่ติดตั้ง</label><input id="et_location" value="${tank.location||''}" placeholder="เช่น ชั้น 2 ใกล้บันไดหนีไฟ"></div>
    <div class="modal-actions">
      <button class="ghost" id="etCancel">ยกเลิก</button>
      <button class="primary" style="width:auto;" id="etSave">บันทึก</button>
    </div>`);
  document.getElementById('etCancel').addEventListener('click', closeModal);
  document.getElementById('etSave').addEventListener('click', async ()=>{
    const name = document.getElementById('et_name').value.trim() || tank.name;
    const location = document.getElementById('et_location').value.trim();
    try{
      await db.collection('fire_tanks').doc(String(num)).update({name, location});
      closeModal();
      showToast('บันทึกแล้ว');
    }catch(e){ showToast('บันทึกไม่สำเร็จ'); }
  });
}

function openTankHistoryModal(num){
  const tank = tanks.find(t=>t.number===num);
  const list = inspections.filter(i=>i.tank_number===num).sort((a,b)=>new Date(b.date)-new Date(a.date));
  openModal(`
    <h3>ประวัติการตรวจ — ${tank.name}</h3>
    ${list.length===0 ? '<div class="empty-state">ยังไม่มีประวัติการตรวจ</div>' : list.map(i=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;">
        <strong>${fmtDate(i.date)}</strong> · ผู้ตรวจ: ${i.inspector}<br>
        <span style="color:var(--ink-soft);">${CHECKLIST_ITEMS.map(c=>i.checklist && i.checklist[c.key] ? '✅' : '❌').join(' ')}</span>
        ${i.note ? `<div style="color:var(--red);margin-top:3px;">⚠ ${i.note}</div>` : ''}
      </div>`).join('')}
    <div class="modal-actions"><button class="ghost" id="histClose">ปิด</button></div>`);
  document.getElementById('histClose').addEventListener('click', closeModal);
}

function printAllQr(){
  const baseUrl = location.origin + location.pathname;
  const cells = tanks.sort((a,b)=>a.number-b.number).map(t=>{
    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(baseUrl + '?tank=' + t.number)}`;
    return `<div class="qr-print-cell"><img src="${qrUrl}"><div class="lbl">ถังที่ ${t.number}</div></div>`;
  }).join('');
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>QR ถังดับเพลิงทั้งหมด</title>
    <style>
      body{font-family:sans-serif;padding:20px;}
      .qr-print-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
      .qr-print-cell{text-align:center;border:1px dashed #999;padding:8px;border-radius:8px;page-break-inside:avoid;}
      .qr-print-cell img{width:100%;max-width:120px;}
      .qr-print-cell .lbl{font-weight:700;font-size:12px;margin-top:4px;}
    </style></head><body>
    <h2>QR ตรวจถังดับเพลิง (${tanks.length} ถัง)</h2>
    <div class="qr-print-grid">${cells}</div>
  </body></html>`);
  w.document.close();
  setTimeout(()=>w.print(), 500);
}

/* ---------------- MAIN RENDER ---------------- */
let tankFormRendered = false;
function render(){
  if(!pinOk){
    renderPinGate(()=>{
      pinOk = true;
      tankFormRendered = false;
      render();
    });
    return;
  }
  if(tankNumber){
    if(!tankFormRendered){ tankFormRendered = true; renderTankInspection(); }
    // ไม่ re-render ฟอร์มซ้ำหลังจากนี้ เพื่อไม่ให้ข้อมูลที่กำลังกรอกอยู่หายไปตอนมีข้อมูลอัปเดตจากที่อื่น
  } else {
    renderAdminDashboard();
  }
}

initListeners();
</script>
